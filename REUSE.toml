# Which licence covers which file. The blueprint generator reads this to print the licence on each drawing, so it must stay accurate.
# Designs are CC BY-NC-SA 4.0 (they remix CC BY-NC-SA works, see SOURCES.md); general-purpose tooling is MIT; the Arimo font keeps its own licence.
# When several annotations match a file, the last one wins.
version = 1

[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Charles Marshall"
SPDX-License-Identifier = "CC-BY-NC-SA-4.0"

[[annotations]]
path = ["tools/**", ".github/**"]
SPDX-FileCopyrightText = "2026 Charles Marshall"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "chip/fonts/**"
SPDX-FileCopyrightText = "2026 The Arimo Project Authors (https://github.com/googlefonts/Arimo)"
SPDX-License-Identifier = "OFL-1.1"
