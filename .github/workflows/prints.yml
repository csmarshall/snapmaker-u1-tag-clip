name: Rebuild prints

on:
  push:
    branches: [main]
    paths:
      - "chip/**"
      - "u1/**"
      - "tools/build_prints.py"
      - "REUSE.toml"  # the licence notice inside every print file is read from it
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/prints.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prints-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          python-version: "3.12"
          enable-cache: true
      - name: Build prints
        run: uv run --locked --no-default-groups python tools/build_prints.py
      - name: Commit changed prints
        run: |
          git add --all prints
          if git diff --cached --quiet -- prints; then
            echo "prints/ unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "prints: rebuild from ${GITHUB_SHA::7}"
          git pull --rebase origin main  # main may have moved during the build
          git push
