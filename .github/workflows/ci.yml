name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.9"
          python-version: "3.12"
          enable-cache: true
      - name: Build chips and docks
        working-directory: chip
        run: uv run --locked python chip_clip.py --label-stl
      - name: Build U1 parts
        run: uv run --locked python u1/u1_build.py
      - name: Test
        run: uv run --locked python -m pytest -q tests u1/tests
