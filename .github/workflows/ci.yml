name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          python-version: "3.12"
          enable-cache: true
      - name: Build chips and docks
        working-directory: chip
        run: uv run --locked python chip_clip.py --label-stl
      - name: Build U1 parts
        run: uv run --locked python u1/u1_build.py
      - name: Test
        run: uv run --locked python -m pytest -q tests u1/tests

  reuse:
    # Every file must say its licence: the blueprint generator prints each drawing's licence from REUSE.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
      - run: uvx --from "reuse[charset-normalizer]==6.3.0" reuse lint
