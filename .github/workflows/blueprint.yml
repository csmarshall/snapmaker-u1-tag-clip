name: Blueprint

# Redraws docs/images/blueprint_dock.{svg,png} and its README embed whenever the dock's model changes,
# using common-blueprint-generator's reusable workflow.
on:
  push:
    branches: [main]
    paths:
      - "chip/**"
      - "u1/**"
      - "tools/export_step.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/blueprint.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  blueprint:
    uses: csmarshall/common-blueprint-generator/.github/workflows/render.yml@main
    with:
      export-command: uv run --locked --no-default-groups python tools/export_step.py
      configs: build/blueprint.yml
      commit-paths: docs/images README.md
